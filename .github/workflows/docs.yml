name: Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'
      - name: Install DocFX
        run: dotnet tool install -g docfx
      - name: Build docs
        run: docfx docfx.json
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: _site
